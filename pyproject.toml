[project]
name = "arfbench"
version = "0.1.0"
description = "Anomaly Reasoning Framework Benchmark"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name="Stephan Xie", email="stephan.xie@datadoghq.com" },
]
dependencies = [
    "anthropic>=0.64.0",
    "datasets>=4.1.1",
    "fastparquet>=2024.11.0",
    "google-genai>=1.51.0",
    "huggingface-hub>=0.34.4",
    "jinja2>=3.1.6",
    "numpy>=2.2.6",
    "openai>=2.24.0",
    "pandas>=2.3.0",
    "peft>=0.17.1",
    "pillow>=11.2.1",
    "pyarrow>=20.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "torch>=2.12.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# GPU setup with vLLM (Linux/CUDA only)
gpu = [
    "transformers>=4.57.1",
    "qwen-vl-utils>=0.0.14",
    "vllm>=0.11.1",
]

# All optional dependencies
all = [
    "transformers>=4.57.1",
    "qwen-vl-utils>=0.0.14",
    "vllm>=0.11.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
